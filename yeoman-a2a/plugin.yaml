name: yeoman-a2a-platform
label: Yeoman A2A
kind: platform
version: 1.1.0
description: >
  Hermes side of the strict Hermes/Yeoman A2A profile
  (urn:hermes-yeoman:a2a-profile:v1). Registers the "yeoman" platform: an inbound
  A2A endpoint that serves an Agent Card carrying the profile extension and accepts
  schema-validated {skill,input} invocations, plus the outbound client tool used to
  call the peer.

  This is a bilateral contract between two specific agents, not a general A2A
  feature: the profile URI, the pinned contract package, and the skill set
  (search.web, research.deep, trading.analyze inbound; whatsapp.send, media.voice.generate outbound)
  are fixed. The generic A2A transport lives in transport.py and never mentions the
  peer; profile.py is the entire Yeoman binding.

  Layered layout:
    transport.py  generic Agent Card + JSON-RPC server, task store, deadline policy
    profile.py    profile URI, contract version, schema validation, skill catalogue
    protocol.py   transport primitives          security.py  auth, redaction, audit
    tools.py      outbound client tools

  Requires the pinned contract package (declare-only: Hermes surfaces it, never
  auto-installs it):
      pip install "hermes-yeoman-a2a-contracts==1.0.2"

  Pure stdlib transport (http.server + urllib) -- no a2a-sdk dependency required.
author: dimitree2k
provides_tools:
  - a2a_discover
  - a2a_call
  - a2a_skill_call
  - a2a_list
  - a2a_history
  - a2a_orchestrate
python_dependencies:
  - "hermes-yeoman-a2a-contracts==1.0.2"
# requires_env / optional_env are surfaced in the `hermes config` UI via the
# platform-plugin env var injector in hermes_cli/config.py.
requires_env: []
optional_env:
  - name: A2A_PEER_TOKENS
    description: "Per-peer bearer tokens ('alice:tok1,bob:tok2'). Each remote agent gets its own credential; the matched name is the authenticated identity used for rate limiting, trust, and audit."
    prompt: "A2A per-peer tokens (name:token, comma-separated; or empty)"
    password: true
  - name: A2A_BEARER_TOKEN
    description: "Shared bearer token for inbound A2A calls (identity falls back to caller IP). With no token of any kind => bind to 127.0.0.1 only (no remote access)."
    prompt: "A2A shared bearer token (or empty for localhost-only)"
    password: true
  - name: A2A_HOST
    description: "Inbound bind host. Defaults to 127.0.0.1; only widens to 0.0.0.0 when a bearer token is set AND you opt in here."
    prompt: "A2A bind host (default 127.0.0.1)"
    password: false
  - name: A2A_PORT
    description: "Inbound A2A server port (default 9900)."
    prompt: "A2A port (default 9900)"
    password: false
  - name: A2A_AGENT_NAME
    description: "Name advertised on this agent's Agent Card (default: hostname-derived)."
    prompt: "A2A agent name"
    password: false
  - name: A2A_ALLOW_ALL_USERS
    description: "Allow any authenticated A2A peer to reach the agent (dev only)."
    prompt: "Allow all A2A peers? (true/false)"
    password: false
  - name: A2A_HOME_CHANNEL
    description: "Task/context id used as the cron / notification delivery target for deliver=a2a."
    prompt: "A2A home channel (or empty)"
    password: false
